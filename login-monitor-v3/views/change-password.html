<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change password | Login Monitor</title><link rel="stylesheet" href="/css/style.css"></head>
<body data-access="user">
<header id="nav"></header>
<main class="container">
<section class="narrow"><h1>Change password</h1><div id="msg" class="alert"></div>
<form id="form"><label>Current password<input type="password" id="current" required autocomplete="current-password"></label>
<label>New password<input type="password" id="next" required autocomplete="new-password"></label>
<label>Confirm new password<input type="password" id="confirm" required autocomplete="new-password"></label>
<button class="btn primary" type="submit">Save password</button></form></section>
</main>
<script src="/js/common.js"></script>
<script src="/js/change-password.js"></script>
</body></html>
