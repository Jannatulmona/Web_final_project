<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register | Login Monitor</title><link rel="stylesheet" href="/css/style.css"></head>
<body data-access="public" class="auth">
<header id="nav"></header>
<main class="container">
<section class="auth-card"><h1>Create account</h1><p class="muted">Use 8+ characters with upper case, lower case and a number.</p>
<div id="msg" class="alert"></div>
<form id="form"><label>Full name<input id="name" required maxlength="60"></label>
<label>Email<input type="email" id="email" required></label>
<label>Password<input type="password" id="password" required autocomplete="new-password"></label>
<label>Confirm password<input type="password" id="confirm" required autocomplete="new-password"></label>
<button class="btn primary" type="submit">Create account</button></form>
<p class="muted">Already registered? <a href="/login">Log in</a></p><p class="muted"><a href="/">&larr; Back to home</a></p></section>
</main>
<script src="/js/common.js"></script>
<script src="/js/register.js"></script>
</body></html>
